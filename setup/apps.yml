trame:
  cmd:
    - /opt/paraview/bin/pvpython
    - /deploy/wish_wells_viewer
    - --host
    - ${host}
    - --port
    - ${port}
    - --authKey
    - ${secret}
    - --server
    - --fespp-plugin-path
    - /work/ttl/build-fespp/lib/paraview-5.13/plugins/Fespp/Fespp.so
    - --slicing-plugin-path
    - /work/ttl/gep/build-gep/lib/paraview-5.13/plugins/GridExtractorPlugin/GridExtractorPlugin.so
    - --local-epc-file-path
    - /deploy/data/PETREL_IJK/PETREL_OLYMPUS_TRAME.epc
    - --remote-epc-file-location
    - ${remote_epc_file_location}
    - --remote-h5-file-location
    - ${remote_h5_file_location}
    - --h5filename
    - ${h5filename}
