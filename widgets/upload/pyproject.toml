[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trame-fespp-upload"
version = "0.1.0"
description = "Decoupled Trame widget: upload data files to the session temp dir (custom Vue)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "trame-client>=3.10",
]

[tool.hatch.build]
include = [
    "/trame_fespp_upload/**/*.py",
    "/trame_fespp_upload/**/*.js",
    "/trame_fespp_upload/**/*.css",
]

[tool.hatch.build.targets.wheel]
packages = ["trame_fespp_upload"]
artifacts = [
    "trame_fespp_upload/module/serve/*.js",
    "trame_fespp_upload/module/serve/*.css",
]
