[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trame-fespp-camlink"
version = "0.1.0"
description = "Decoupled Trame widget: the Link cameras card of a 3D view"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "trame-client>=3.10",
]

[tool.hatch.build]
include = [
    "/trame_fespp_camlink/**/*.py",
    "/trame_fespp_camlink/**/*.js",
    "/trame_fespp_camlink/**/*.css",
]

[tool.hatch.build.targets.wheel]
packages = ["trame_fespp_camlink"]
artifacts = [
    "trame_fespp_camlink/module/serve/*.js",
    "trame_fespp_camlink/module/serve/*.css",
]
