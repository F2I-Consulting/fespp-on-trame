<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Well-log correlation — demo</title>
  <!-- d3 v7 from CDN, no build. The renderer is an ES module (it imports the
       shared number format from ../_shared), so this page must be served over
       http — e.g. `npx serve widgets`, then /welllog/demo.html. -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script type="module" src="./src/correlation.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #deded6; }
    #bar { padding: 8px 14px; background: #2c3e50; color: #fff; display: flex; gap: 16px; align-items: center; }
    #bar h1 { font-size: 15px; margin: 0; font-weight: 600; }
    #bar label { font-size: 13px; }
    #panel { height: calc(100vh - 42px); overflow: auto; }
  </style>
</head>
<body>
  <div id="bar">
    <h1>Well-log correlation</h1>
    <span style="opacity:.85;font-size:12px">mock data — 3 wells · <b>click a marker</b> to flatten · <b>Ctrl + wheel</b> to zoom</span>
  </div>
  <div id="panel"></div>

  <script type="module">
    const data = WellLogCorrelation.mockData();
    WellLogCorrelation.render(document.getElementById("panel"), data);
  </script>
</body>
</html>
