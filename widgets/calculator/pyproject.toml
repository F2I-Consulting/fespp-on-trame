[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trame-fespp-calculator"
version = "0.1.0"
description = "Decoupled Trame widget: a calculator panel"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "trame-client>=3.10",
]

[tool.hatch.build]
include = [
    "/trame_fespp_calculator/**/*.py",
    "/trame_fespp_calculator/**/*.js",
    "/trame_fespp_calculator/**/*.css",
]

[tool.hatch.build.targets.wheel]
packages = ["trame_fespp_calculator"]
artifacts = [
    "trame_fespp_calculator/module/serve/*.js",
    "trame_fespp_calculator/module/serve/*.css",
]
