[metadata]
name = fespp-on-trame
version = 0.1.0
description = Trame application to visualize RESQML data
long_description = file: README.rst
long_description_content_type = text/x-rst
author = F2i-consulting
license = Other
classifiers =
    Development Status :: 4 - Beta
    Environment :: Web Environment
    License :: Other/Proprietary License
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python :: 3 :: Only
    Programming Language :: JavaScript
    Topic :: Software Development :: Libraries :: Application Frameworks
    Topic :: Software Development :: Libraries :: Python Modules
keywords =
    Python
    Interactive
    Web
    Application
    Framework

[options]
packages = find:
include_package_data = True
install_requires =
    dataclasses_json
    numpy
    trame
    trame-iframe
    trame-vuetify>=3.2.2
    # Pinned — trame-vtk 2.11.9 added a monolithic `import vtk` that pulls
    # in vtkmodules.vtkViewsInfovis (absent from ParaView 6.0.1's VTK),
    # crashing the view init at startup. 2.11.8 works. See
    # setup/requirements.txt for the full note.
    trame-vtk==2.11.8
    trame-dockview
    trame-plotly
    plotly
    # no `vtk`: pvpython uses ParaView's own VTK; see setup/requirements.txt
    requests

[options.package_data]
# Earth texture of the Globe view (app/boot.py) — must reach site-packages
# when the package is pip-installed (container), not only in a repo checkout.
fespp_on_trame = assets/*

[flake8]
max-line-length = 120
per-file-ignores = 
    # import modules but unused
    */__init__.py:F401
