# Apache in front of the fespp_on_trame container (deploy/linux/run.sh): a
# password, and the /fespp sub-path proxied to 127.0.0.1:8090, the sessions'
# WebSocket included. deploy/apache/setup.sh installs it with FESPP_DOMAIN
# replaced, then certbot adds its HTTPS twin and the redirect to it.
<VirtualHost *:80>
    ServerName FESPP_DOMAIN

    ProxyPreserveHost On
    ProxyRequests Off
    # a session is a WebSocket open as long as the page is: no short idle cut
    ProxyTimeout 3600

    RedirectMatch ^/fespp$ /fespp/
    <Location /fespp/>
        AuthType Basic
        AuthName "Fespp on Trame"
        AuthUserFile /etc/apache2/fespp.htpasswd
        Require valid-user
        # EPC and HDF5 uploads run to gigabytes
        LimitRequestBody 0
        # the container expects the prefix (TRAME_URL_PREFIX); upgrade=websocket
        # carries the sessions' WebSocket (Apache 2.4.47 and later)
        ProxyPass http://127.0.0.1:8090/fespp/ upgrade=websocket
        ProxyPassReverse http://127.0.0.1:8090/fespp/
    </Location>
</VirtualHost>
